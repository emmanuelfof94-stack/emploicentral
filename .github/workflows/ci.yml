name: ci

# Fiabilité : tests backend + typecheck/lint frontend à chaque push et PR.
# Aucun secret requis : les tests tournent sur une base SQLite temporaire, sans
# réseau (SMTP / WhatsApp / IA / Sentry neutralisés par tests/conftest.py).
on:
  push:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # même version que l'image Render (deploy/Dockerfile.render)
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lancer les tests
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.app.json
      - name: Lint
        run: pnpm lint
